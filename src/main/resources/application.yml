spring:
  application:
    name:paypulse
  datasource:
    url:
    username:
    password:
    driver-class-name: org.postresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
