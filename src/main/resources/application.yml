spring:
  application:
    name: paypulse

  # H2 Web Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:wallet_db;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
